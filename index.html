<!DOCTYPE html>

<!-- Link Bootstrap CSS -->

<body>
    
    <!-- HTML:
            .img src="" -> Bild einbauen 
            .alt="" -> Alternativer Text 
    -->
    <!-- Bootstrap:
            .class="img-fluid" macht das Bild responsiv
            .m-4 -> Margin rundherum (Spacing-Level 4)
            .rounded -> abgerundete ecken (leicht)
            .rounded-3 -> etwas stärker -> Skala 0-5

    -->
    <!-- <img src="hero.webp" alt="Hero_Bild_V1" class="img-fluid m-4 rounded-4"> -->

    <!-- HTML/CSS:
            .<div> -> Division, neutraler Block, Gruppierung
    -->

    <!-- Bootstrap:

            .container  -> fester maximaler Seitenrand

                            Größe               Kürzel              Mindestbreite / Breakpoint      Container max-width 
                            ------------------------------------------------------------------------------------------------
                            Extra Small         (kein Kürzel)       < 576px                         100%  
                            Small               sm                  >= 576px                        540px
                            Medium              md                  >= 768px                        720px
                            Large               lg                  >= 992px                        960px
                            Extra Large         xl                  >= 1200px                       1140px
                            XXL                 xxl                 >= 1400px                       1320px

                        -> automatische Responsivität 
                        -> zentrierte Inhalte

            .my -> m = margin (Außenabstand)
                -> p = padding (Innenabstand)

                -> t = top
                -> b = bottom 
                -> s = start (links) 
                -> e = end (rechts)
                -> x = links + rechts
                -> y = oben + unten 
                
                -> m(margin)+y(oben+unten)
            
            .overflow-hidden -> alles was über rand hinaus geht wird abgeschnitten (Normalerweise darf Inhalt über Rand hinausragen)

            .w-100 -> width 100% -> nimmt 100% der Breite des Eltern-Elements ein 

            .position-relative -> Alles was "absolute" positioniert ist orientiert sich an mir und NICHT an gesamtem Browserfenster
            .position-absolute -> Element wird aus "normalem Fluss" genommen und kann frei platziert werden

            .top-50 -> 50% von oben
            .start-50 -> 50% von links
            .translate-middle   -> Zentriert Element in sich an den davor bestimmten Punkt
                                -> ohne wäre obere linke ecke des Elements an davor bestimmtem Punkt, nicht die Mitte des Elements

            .d-flex -> aktiviert Flexboy 
                    -> standardmäßig auf row 
                        -> horizontale = Hauptachse
                        -> vertikal = Querachse  

            .flex-column    -> Elemente werden untereinander gestapelt, nicht mehr nebeneinander (row)
                                -> horizontale = Querachse
                                -> vertikale = Hauptachse

            .justify-content -> steuert Hauptachse  -> start
                                                    -> center 
                                                    -> end 
            .align-items -> steuert Querachse   -> start
                                                -> center
                                                -> end
            .

    -->

    <!-- Aufbau: 
            
            1. Layout-Ebene (container)
            2. Design-Ebene (overflow..)
            3. Inhalt-Ebene (Bild)

    -->
    <div class="px-3 pt-3">
